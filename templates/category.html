{% extends 'base.html' %}

{% block content %}
<style>
    .category-page-container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
        color: #ffffff;
    }

    .category-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .category-header h1 {
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 15px;
        font-family: sans-serif;
    }

    .category-intro {
        color: #cccccc;
        max-width: 800px;
        margin: 0 auto 20px auto;
        line-height: 1.6;
        font-size: 1.1em;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        padding: 10px 20px;
        background-color: #1a1a1a;
        border: 1px solid #333;
        color: #fff !important;
        text-decoration: none;
        border-radius: 4px;
        font-family: sans-serif;
        transition: background 0.3s, transform 0.2s;
        margin-bottom: 30px;
    }

    .back-btn:hover {
        background-color: #333;
        text-decoration: none;
        transform: translateX(-5px);
    }

    .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
    }

    .image-grid img {
        width: 100%;
        height: 300px;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        transition: transform 0.3s ease;
        cursor: pointer; /* Shows a pointer finger on hover */
    }

    .image-grid img:hover {
        transform: scale(1.03);
    }

    /* --- Lightbox Modal Styles --- */
    .modal {
        display: none; /* Hidden by default */
        position: fixed;
        z-index: 1000;
        padding-top: 50px;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.9); /* Black background with opacity */
    }

    .modal-content {
        margin: auto;
        display: block;
        max-width: 90%;
        max-height: 85vh;
        object-fit: contain;
    }

    .close {
        position: absolute;
        top: 20px;
        right: 35px;
        color: #f1f1f1;
        font-size: 40px;
        font-weight: bold;
        transition: 0.3s;
        cursor: pointer;
    }

    .close:hover,
    .close:focus {
        color: #bbb;
        text-decoration: none;
        cursor: pointer;
    }
</style>

<div class="category-page-container">
    <a href="{{ url_for('portfolio') }}" class="back-btn">&larr; Back to Categories</a>

    <div class="category-header">
        <h1>{{ category_name }}</h1>
        {% if intro %}
            <p class="category-intro">{{ intro }}</p>
        {% endif %}
    </div>

    <!-- Image Grid -->
    <div class="image-grid">
        {% for item in items %}
            <!-- Added onclick event to trigger the modal -->
            <img src="{{ url_for('static', filename='uploads/' + item.filename) }}" alt="Portfolio Image" onclick="openModal(this.src)">
        {% endfor %}
    </div>
</div>

<!-- The Modal -->
<div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImage">
</div>

<!-- JavaScript for Modal -->
<script>
    function openModal(imageSrc) {
        document.getElementById("imageModal").style.display = "block";
        document.getElementById("modalImage").src = imageSrc;
    }

    function closeModal() {
        document.getElementById("imageModal").style.display = "none";
    }
</script>
{% endblock %}
