<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aura Capture{% endblock %}</title>

    <!-- Lightbox2 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">

    <!-- Link to your main stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="{{ url_for('home') }}" class="{{ 'active' if active_page == 'home' else '' }}">Home</a></li>
            <li><a href="{{ url_for('portfolio') }}" class="{{ 'active' if active_page == 'portfolio' else '' }}">Portfolio</a></li>
            <li><a href="{{ url_for('about') }}" class="{{ 'active' if active_page == 'about' else '' }}">About</a></li>
            <li><a href="{{ url_for('contact') }}" class="{{ 'active' if active_page == 'contact' else '' }}">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content Block -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer with Smart Admin Links -->
    <footer>
        <p>&copy; 2026 Aura Capture. All Rights Reserved.</p>
        <div style="margin-top: 10px; font-size: 0.8rem;">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('admin') }}" style="color: #c5a059; text-decoration: none; margin-right: 15px;">⚙️ Admin Panel</a>
                <a href="{{ url_for('logout') }}" style="color: #888; text-decoration: none;">🚪 Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}" style="color: #888; text-decoration: none;">🔒 Admin Login</a>
            {% endif %}
        </div>
    </footer>

    <!-- jQuery (required by Lightbox2) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Lightbox2 JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>

    <!-- Block for page-specific JavaScript -->
    {% block scripts %}{% endblock %}

    <!-- Theme Toggle Button (commented out) -->
    <!-- <button id="theme-toggle" class="theme-toggle-btn">☀️</button> -->

    <!-- Theme Toggle Script (disabled because button is commented) -->

            } else {

                themeToggleBtn.innerText = '☀️';
            }
        });
    </script>

</body>
</html>
